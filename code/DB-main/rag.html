<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>꼿꼿 AI 검색</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <style>
      :root {
        --bg: #f5f7fa; --card: #ffffff; --text: #1f2933; --muted: #6b7785;
        --line: #e3e8ee; --brand: #3ecf8e; --brand-dark: #24a46d; --accent: #eefaf4; --error: #d64545;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--bg); color: var(--text); }
      .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
      h1 { font-size: 24px; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      input[type="email"], input[type="password"], textarea {
        flex: 1; min-width: 180px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit;
      }
      textarea { width: 100%; resize: vertical; min-height: 64px; }
      button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: var(--brand-dark); }
      button:disabled { background: #a8b3bd; cursor: default; }
      button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); font-weight: 400; }
      .status { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 0; }
      .chip { padding: 6px 12px; border-radius: 999px; background: var(--accent); color: var(--brand-dark); font-size: 13px; border: 1px solid #cdeedd; cursor: pointer; font-weight: 400; }
      .chip:hover { background: #dcf5e8; }
      .ask-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
      .answer { line-height: 1.75; white-space: pre-wrap; word-break: keep-all; }
      .cite { display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; border-radius: 4px; background: var(--accent); color: var(--brand-dark); font-size: 12px; font-weight: 700; text-align: center; }
      .label { font-size: 13px; font-weight: 700; color: var(--muted); margin: 0 0 10px; }
      .source { border-top: 1px solid var(--line); padding: 12px 0; }
      .source:first-of-type { border-top: 0; padding-top: 0; }
      .source-head { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
      .score { color: var(--muted); font-weight: 400; white-space: nowrap; }
      .source p { margin: 0; color: #46525e; font-size: 14px; line-height: 1.6; }
      .meta { color: var(--muted); font-size: 12px; margin-top: 12px; }
      .error { color: var(--error); }
      .hidden { display: none; }
      .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: -3px; margin-right: 8px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>🔎 꼿꼿 AI 검색</h1>
      <p class="sub">질문을 입력하면 꼿꼿 AI 소개 자료에서 관련 내용을 찾아 Gemini가 답변을 정리해 드립니다.</p>

      <!-- 질문 -->
      <div class="card" id="ask-card">
        <form id="ask-form">
          <textarea id="question" maxlength="500" placeholder="예: 목 숙임은 몇 도부터 알림이 울리나요?"></textarea>
          <div class="chips" id="examples"></div>
          <div class="ask-actions"><button type="submit" id="ask-btn">질문하기</button></div>
        </form>
      </div>

      <!-- 결과 -->
      <div class="card hidden" id="answer-card">
        <div class="label">답변</div>
        <div class="answer" id="answer"></div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="card hidden" id="sources-card">
        <div class="label">참고한 문서</div>
        <div id="sources"></div>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://hzjigjfgdaytvwytesxu.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6amlnamZnZGF5dHZ3eXRlc3h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4MzU5OTcsImV4cCI6MjEwNzQxMTk5N30.22CCXh1NaAMaEmrM1xIQq_LvD8ot40jMZhZMy31fcrw";
      const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const EXAMPLES = [
        "꼿꼿 AI는 어떤 자세를 감지해?",
        "영상이나 얼굴이 저장돼?",
        "알림은 하루에 몇 번까지 울려?",
        "투자 회수기간은 얼마나 걸려?",
        "메인 모델은 어떻게 학습해?",
        "MediaPipe를 로봇에 안 쓰는 이유는?",
      ];

      const $ = (id) => document.getElementById(id);
      const show = (id, on = true) => $(id).classList.toggle("hidden", !on);
      const escapeHtml = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

      // 답변 텍스트: HTML 이스케이프 후 **굵게**와 [1] 인용 표시만 꾸밈
      const formatAnswer = (text) =>
        escapeHtml(text)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\[(\d+)\]/g, '<span class="cite">$1</span>');

      for (const q of EXAMPLES) {
        const b = document.createElement("button");
        b.type = "button"; b.className = "chip"; b.textContent = q;
        b.onclick = () => { $("question").value = q; ask(); };
        $("examples").appendChild(b);
      }

      $("ask-form").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
      $("question").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); }
      });

      async function ask() {
        const question = $("question").value.trim();
        if (!question) return;

        $("ask-btn").disabled = true;
        show("answer-card"); show("sources-card", false);
        $("answer").innerHTML = '<span class="spinner"></span>관련 문서를 찾고 답변을 작성하는 중...';
        $("meta").textContent = "";

        try {
          // Edge Function 호출 (로그인 없이 anon 키로 호출 → 전체 문서 검색)
          const { data, error } = await sb.functions.invoke("rag-search", { body: { question } });
          if (error) {
            const detail = await error.context?.json?.().catch(() => null);
            throw new Error(detail?.error || error.message);
          }

          $("answer").innerHTML = formatAnswer(data.answer);
          $("meta").textContent = data.model ? `생성 모델: ${data.model}` : "";

          $("sources").innerHTML = "";
          data.sources.forEach((s, i) => {
            const div = document.createElement("div");
            div.className = "source";
            div.innerHTML = `
              <div class="source-head">
                <span><span class="cite">${i + 1}</span> ${escapeHtml(s.title)}</span>
                <span class="score">유사도 ${(s.similarity * 100).toFixed(1)}%</span>
              </div>
              <p>${escapeHtml(s.content)}</p>`;
            $("sources").appendChild(div);
          });
          show("sources-card", data.sources.length > 0);
        } catch (err) {
          $("answer").innerHTML = `<span class="error">오류: ${escapeHtml(err.message)}</span>`;
        } finally {
          $("ask-btn").disabled = false;
        }
      }
    </script>
  </body>
</html>
